<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Seletor · celular</title>
<link rel="stylesheet" href="base.css">
<style>
body{font-size:14px}
.tela{width:390px;height:844px}
.topo{position:absolute;left:0;right:0;top:36px;text-align:center}
.etiqueta.grande{font-size:26px}
.sub{margin-top:12px;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.cartas{position:absolute;left:50%;top:130px;transform:translateX(-50%);display:flex;flex-direction:column;gap:34px}
.polaroid{width:220px;padding:10px 10px 40px}
.polaroid .foto{height:190px}.polaroid .foto img{height:176px}
.polaroid .nome{font-size:22px;bottom:8px;padding:.2em .7em}
.polaroid .radio{width:24px;height:24px;bottom:-32px;border-width:3px}
.polaroid.a{transform:rotate(-2deg)}.polaroid.b{transform:rotate(2deg)}
.acao{position:absolute;left:50%;transform:translateX(-50%);bottom:40px}
.botao{font-size:22px;padding:.4em 1.4em .34em;border-width:3px;box-shadow:0 5px 0 #7a0a1c}
</style></head>
<body><script src="props.js"></script>
<div class="tela crt celular">
  <div class="pontos"><i></i><i></i><i></i></div>
  <div class="vidro">
    <div class="chuvisco"></div>
    <svg class="rabisco" style="left:14px;top:300px;color:#ff3d9a;width:50px;height:50px;transform:rotate(-15deg)"><use href="#heart"/></svg>
    <svg class="rabisco" style="right:14px;top:120px;color:#e2c22a;width:46px;height:46px"><use href="#smiley"/></svg>
    <svg class="rabisco" style="right:18px;bottom:160px;color:#3d8bff;width:46px;height:46px"><use href="#star5"/></svg>
    <div class="topo"><span class="etiqueta grande">Qual é o resultado?</span><div class="sub">Escolha o gênero do bebê:</div></div>
    <div class="cartas">
      <div class="polaroid m a sel"><div class="foto"><img src="kaio.svg" alt=""></div><span class="etiqueta nome">Menino</span><span class="radio on"></span></div>
      <div class="polaroid f b"><div class="foto"><img src="nanda.svg" alt=""></div><span class="etiqueta nome">Menina</span><span class="radio"></span></div>
    </div>
    <div class="acao"><a class="botao" href="#">Confirmar</a></div>
  </div>
  <div class="legenda">2. SELETOR (CELULAR)</div>
</div></body></html>
