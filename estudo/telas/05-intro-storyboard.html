<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Storyboard da abertura</title>
<link rel="stylesheet" href="base.css">
<style>
.tela{height:1300px;padding:50px 70px;background:#141216;color:#f2efe4;font-family:var(--f-corpo)}
h1{margin:0;font-family:var(--f-poster);font-size:44px;color:#fff;text-shadow:5px 5px 0 var(--magenta)}
h1 small{display:block;font:700 18px/1.3 var(--f-maquina);letter-spacing:.14em;text-transform:uppercase;color:#bbb;text-shadow:none;margin-bottom:6px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:30px 26px;margin-top:26px}
figure{margin:0}
figure img{display:block;width:100%;border-radius:14px;box-shadow:0 14px 30px rgba(0,0,0,.6)}
figcaption{margin-top:12px;font:600 19px/1.3 var(--f-corpo);color:#cfcdc5}
figcaption b{display:block;font:400 22px var(--f-maquina);text-transform:uppercase;color:var(--amarelo);margin-bottom:2px}
figcaption i{font-style:normal;color:var(--rosa);font-weight:800}
.total{margin-top:22px;font:600 21px var(--f-corpo);color:#cfcdc5;text-align:center}
</style></head>
<body><div class="tela">
  <h1><small>Abertura · roda depois do play, antes do jogo · cerca de 70 segundos · um clique pula</small>Storyboard da abertura</h1>
  <div class="grade">
    <figure><img src="../imagens/05a-intro-vhs.png" alt=""><figcaption><b>1. A fita entra</b>Chiado, "PLAY ▶", tracking. <i>5 s</i></figcaption></figure>
    <figure><img src="../imagens/05b-intro-crawl.png" alt=""><figcaption><b>2. Letreiro Star Wars</b>A história dos dois: 1989 Guarujá, 1993 SJC, emo, Engenheiros. <i>30 s</i></figcaption></figure>
    <figure><img src="../imagens/05c-intro-delorean.png" alt=""><figcaption><b>3. De volta para o futuro</b>O painel do carro: destino 2026, presente 1989, última partida 1993. <i>8 s</i></figcaption></figure>
    <figure><img src="../imagens/05d-intro-jurassic.png" alt=""><figcaption><b>4. Parque dos bebês</b>Logo com o T-Rex, trovão, título surge por trás. <i>6 s</i></figcaption></figure>
    <figure><img src="../imagens/05e-intro-matrix.png" alt=""><figcaption><b>5. Matrix</b>Chuva de código, "pílula azul ou pílula rosa?". <i>6 s</i></figcaption></figure>
    <figure><img src="../imagens/05f-intro-aventura.png" alt=""><figcaption><b>6. Uma nova aventura</b>Os dois de costas olhando o mar, com o gato. Corta pro jogo. <i>8 s</i></figcaption></figure>
  </div>
  <p class="total">Cada cena é HTML, CSS e SVG animados, sem vídeo e sem nada de fora: leve, nítida em qualquer projetor e fácil de ajustar o texto.</p>
</div></body></html>
