<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Storyboard da abertura</title>
<link rel="stylesheet" href="base.css">
<style>
.tela{height:1300px;padding:50px 70px;background:var(--papel)}
h1{margin:0;font-family:var(--f-nome);font-size:50px}
h1 small{display:block;font:700 20px/1.3 var(--f-corpo);letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-2);margin-bottom:4px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:30px 26px;margin-top:26px}
figure{margin:0}
figure img{display:block;width:100%;border:6px solid var(--tinta);border-radius:18px;box-shadow:10px 10px 0 var(--tinta)}
figcaption{margin-top:14px;font:600 20px/1.3 var(--f-corpo);color:var(--tinta-2)}
figcaption b{display:block;font-family:var(--f-nome);font-weight:400;font-size:28px;color:var(--tinta)}
figcaption i{font-style:normal;color:var(--laranja);font-weight:800}
.total{margin-top:22px;font:600 22px var(--f-corpo);color:var(--tinta-2);text-align:center}
</style></head>
<body><div class="tela grao">
  <h1><small>Abertura · roda depois do play, antes do jogo · ~60 segundos no total</small>Storyboard da abertura</h1>
  <div class="grade">
    <figure><img src="../imagens/05a-intro-vhs.png" alt=""><figcaption><b>1. A fita entra</b>Chiado, "PLAY ▶", tracking. <i>5 s</i> · som de videocassete engolindo a fita.</figcaption></figure>
    <figure><img src="../imagens/05b-intro-sessao.png" alt=""><figcaption><b>2. Sessão da Tarde apresenta</b>Pôr do sol, coqueiros, letreiro cromado. <i>6 s</i></figcaption></figure>
    <figure><img src="../imagens/05c-intro-crawl.png" alt=""><figcaption><b>3. Letreiro Star Wars</b>A história dos dois: 1989 Guarujá, 1993 SJC, emo, Engenheiros. <i>30 s</i> · pode pular com um clique.</figcaption></figure>
    <figure><img src="../imagens/05d-intro-jurassic.png" alt=""><figcaption><b>4. Título Jurassic Park</b>Logo com chupeta, trovão, título surge por trás. <i>6 s</i></figcaption></figure>
    <figure><img src="../imagens/05e-intro-matrix.png" alt=""><figcaption><b>5. Matrix</b>Chuva de código, "pílula azul ou rosa?". <i>6 s</i></figcaption></figure>
    <figure><img src="../imagens/05f-intro-arcade.png" alt=""><figcaption><b>6. Fliperama: READY? JOGA!</b>Player 1 vs Player 2, e corta pro tabuleiro. <i>5 s</i></figcaption></figure>
  </div>
  <p class="total">Cada quadro é uma cena em HTML/CSS animada (sem vídeo), então fica leve, nítida em qualquer projetor e fácil de ajustar o texto.</p>
</div></body></html>
