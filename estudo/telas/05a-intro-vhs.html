<style>
.crt .vidro{background:#050505}

.centro .l2{font-family:var(--f-vhs);font-size:150px;line-height:1;letter-spacing:.06em;text-shadow:4px 0 #0ff,-4px 0 #f0f}
.centro .l3{font-family:var(--f-vhs);font-size:48px;color:#bbb;letter-spacing:.1em;margin-top:10px}
