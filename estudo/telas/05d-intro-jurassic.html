<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Intro 4 · Jurassic</title>
<link rel="stylesheet" href="base.css">
<style>
.crt .vidro{background:radial-gradient(ellipse at 50% 40%,#1a1208,#000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center}
.folhas{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 420px 900px at 0% 100%,rgba(30,60,20,.8),transparent 70%),radial-gradient(ellipse 420px 900px at 100% 100%,rgba(30,60,20,.8),transparent 70%)}
.badge{position:static;width:520px;height:520px;filter:drop-shadow(0 0 40px rgba(255,210,63,.35)) drop-shadow(0 30px 60px rgba(0,0,0,.8))}
.t1{font-family:var(--f-poster);font-size:150px;line-height:.95;color:#fff2c4;margin-top:30px;text-shadow:0 0 2px #000,8px 8px 0 #c8102e;letter-spacing:.02em}
.t2{font-family:var(--f-poster);font-size:64px;letter-spacing:.14em;color:var(--amarelo);margin-top:14px}
.raio{position:absolute;right:220px;top:60px;color:#fff;width:160px;height:160px;filter:drop-shadow(0 0 20px #fff)}
.rodape{position:absolute;bottom:36px;font:700 24px var(--f-corpo);letter-spacing:.3em;color:#9a8a60;text-transform:uppercase}
</style></head>
<body><script src="props.js"></script>
<div class="tela crt">
  <div class="pontos"><i></i><i></i><i></i></div>
  <div class="vidro">
    <div class="folhas"></div>
    <svg class="rabisco raio"><use href="#bolt"/></svg>
    <svg class="prop badge"><use href="#jpbadge"/></svg>
    <div class="t1">CHÁ REVELAÇÃO</div>
    <div class="t2">NANDA &amp; KAIO</div>
    <div class="rodape">Ilha do Guarujá · Vale do Paraíba · 65 milhões de anos depois dos anos 90</div>
  </div>
  <div class="legenda">5.4 ABERTURA · PARQUE DOS BEBÊS</div>
</div></body></html>
