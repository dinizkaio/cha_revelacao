<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Jogo</title>
<link rel="stylesheet" href="base.css">
<style>
.tela{background:var(--papel);display:grid;grid-template-rows:120px 1fr 90px;grid-template-columns:460px 1fr 460px;grid-template-areas:"topo topo topo" "m tab f" "rodape rodape rodape"}
.topo{grid-area:topo;display:flex;align-items:center;justify-content:space-between;padding:0 70px;border-bottom:6px solid var(--tinta);background:var(--ipe)}
.topo .marca{display:flex;align-items:baseline;gap:16px}
.topo .titulo{font-size:46px}
.topo .nome{font-size:40px;color:var(--menino-2)}
.topo .nome em{font-style:normal;color:var(--menina-2)}
.vez{display:inline-flex;align-items:center;gap:18px;background:var(--tinta);color:var(--ipe);padding:14px 28px;border-radius:14px;font-family:var(--f-arcade);font-size:26px}
.vez i{width:22px;height:22px;border-radius:50%;background:#39ff6a;box-shadow:0 0 14px #39ff6a}
.lado{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 0 10px;position:relative}
.lado img{height:470px}
.lado .nome{font-size:70px;letter-spacing:.04em;margin-top:6px}
.lado.m .nome{color:var(--menino-2)}.lado.f .nome{color:var(--menina-2)}
.lado .status{margin-top:8px;font:800 22px var(--f-corpo);letter-spacing:.1em;text-transform:uppercase;padding:8px 20px;border-radius:999px;border:4px solid var(--tinta);background:#fff8e6}
.lado.m{grid-area:m}.lado.f{grid-area:f}
.tab{grid-area:tab;display:grid;place-items:center;position:relative}
.mesa{padding:34px;border:8px solid var(--tinta);border-radius:40px;background:
  linear-gradient(45deg,transparent 46%,rgba(31,154,166,.35) 46% 54%,transparent 54%),
  linear-gradient(-45deg,transparent 46%,rgba(31,154,166,.35) 46% 54%,transparent 54%),#eef6f5;background-size:40px 40px;box-shadow:16px 16px 0 var(--tinta)}
.grade{display:grid;grid-template-columns:repeat(4,170px);gap:22px}
.cel{width:170px;height:170px;border-radius:50%;border:7px solid var(--tinta);position:relative;display:grid;place-items:center;overflow:hidden;background:#fff}
.cel.v{background:repeating-conic-gradient(var(--ipe) 0 20deg,var(--laranja) 20deg 40deg);box-shadow:inset 0 -10px 0 rgba(43,29,20,.18),0 10px 0 var(--tinta-2)}
.cel.v::after{content:"★";position:absolute;inset:0;display:grid;place-items:center;color:#fff5d6;font-size:70px;background:radial-gradient(circle,var(--laranja) 0 42%,transparent 44%)}
.cel.m{background:var(--menino)}.cel.f{background:var(--menina)}
.cel img{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:225px;height:310px}
.rodape{grid-area:rodape;display:flex;align-items:center;justify-content:center;gap:40px;font:600 26px var(--f-corpo);color:var(--tinta-2);border-top:4px solid var(--tinta)}
.rodape b{color:var(--tinta)}
</style></head>
<body><div class="tela grao">
  <div class="topo">
    <div class="marca"><span class="titulo">Chá Revelação</span><span class="nome"><em>Nanda</em> &amp; Caio</span></div>
    <div class="vez"><i></i>VEZ DE: NANDA &nbsp;·&nbsp; TAZO 4 DE 16</div>
  </div>
  <div class="lado m"><img src="menino.svg" alt=""><p class="nome">Menino</p><span class="status">2 Tazos</span></div>
  <div class="tab">
    <div class="mesa"><div class="grade">
      <div class="cel v"></div><div class="cel m"><img src="menino.svg" alt=""></div><div class="cel v"></div><div class="cel v"></div>
      <div class="cel v"></div><div class="cel v"></div><div class="cel f"><img src="menina.svg" alt=""></div><div class="cel v"></div>
      <div class="cel m"><img src="menino.svg" alt=""></div><div class="cel v"></div><div class="cel v"></div><div class="cel v"></div>
      <div class="cel v"></div><div class="cel v"></div><div class="cel v"></div><div class="cel v"></div>
    </div></div>
  </div>
  <div class="lado f"><img src="menina.svg" alt=""><p class="nome">Menina</p><span class="status">1 Tazo</span></div>
  <div class="rodape"><span>Vire um Tazo por vez, revezando. <b>Três iguais em linha</b> (reta ou diagonal) revelam o bebê.</span></div>
</div></body></html>
