<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Play</title>
<link rel="stylesheet" href="base.css">
<style>
.topo{position:absolute;left:0;right:0;top:70px;text-align:center}
.sub{margin-top:26px;font-size:30px;letter-spacing:.06em;text-transform:uppercase;line-height:1.35}
.fita{position:absolute;left:50%;top:300px;width:820px;height:484px;margin-left:-410px;filter:drop-shadow(0 20px 30px rgba(0,0,0,.5))}
.play{position:absolute;left:50%;top:380px;width:170px;height:170px;margin-left:-85px;border-radius:50%;border:8px solid var(--magenta);box-shadow:0 0 30px var(--magenta),inset 0 0 30px rgba(255,61,154,.6);display:grid;place-items:center;background:rgba(40,0,30,.6)}
.play::after{content:"";border-left:70px solid var(--magenta);border-top:42px solid transparent;border-bottom:42px solid transparent;margin-left:16px;filter:drop-shadow(0 0 12px var(--magenta))}
.raio{position:absolute;left:50%;top:465px;width:60px;height:8px;background:var(--rosa);border-radius:4px;transform-origin:0 50%;box-shadow:0 0 10px var(--magenta)}
.etq-play{position:absolute;left:50%;top:690px;transform:translateX(-50%) rotate(-1.5deg);font-size:54px}
.seg{position:absolute;left:50%;transform:translateX(-50%);bottom:40px;width:900px;font-size:20px;line-height:1.4;text-transform:uppercase;letter-spacing:.08em;color:#3a3a3a;text-align:center}
.pizza{left:120px;top:150px;width:170px;height:170px;transform:rotate(-25deg)}
.slinky{left:60px;top:560px;width:260px;height:170px}
.gameboy{right:120px;top:150px;width:160px;height:256px;transform:rotate(12deg)}
.tv{left:90px;bottom:60px;width:260px;height:224px}
.dino{right:110px;bottom:70px;width:300px;height:210px;fill:#8a3fc8;transform:scaleX(-1)}
.cassete{right:400px;top:160px;width:170px;height:106px;transform:rotate(8deg)}
.prop{filter:drop-shadow(0 8px 8px rgba(0,0,0,.35))}
</style></head>
<body><script src="props.js"></script>
<div class="tela crt">
  <div class="pontos"><i></i><i></i><i></i></div>
  <div class="vidro">
    <div class="chuvisco"></div>
    <svg class="rabisco" style="left:380px;top:520px;color:#ff3d9a;width:80px;height:80px"><use href="#sparkle"/></svg>
    <svg class="rabisco" style="right:380px;top:300px;color:#e2c22a;width:100px;height:100px;transform:rotate(15deg)"><use href="#star5"/></svg>
    <svg class="rabisco" style="left:460px;top:240px;color:#3d8bff;width:90px;height:90px;transform:rotate(-10deg)"><use href="#heart"/></svg>
    <svg class="prop pizza"><use href="#pizza"/></svg>
    <svg class="prop slinky"><use href="#slinky"/></svg>
    <svg class="prop gameboy"><use href="#gameboy"/></svg>
    <svg class="prop tv"><use href="#oldtv"/></svg>
    <svg class="prop dino"><use href="#trex"/></svg>
    <svg class="prop cassete"><use href="#cassette"/></svg>
    <div class="topo">
      <span class="etiqueta grande">Tá tudo pronto!</span>
      <div class="sub">Agora é só apertar o play<br>e começar essa aventura!</div>
    </div>
    <svg class="prop fita"><use href="#vhs"/></svg>
    <div class="play"></div>
    <i class="raio" style="transform:rotate(-30deg) translateX(100px)"></i><i class="raio" style="transform:rotate(-150deg) translateX(100px)"></i>
    <i class="raio" style="transform:rotate(-70deg) translateX(100px)"></i><i class="raio" style="transform:rotate(-110deg) translateX(100px)"></i>
    <span class="etiqueta etq-play">Play</span>
    <div class="seg">🔒 Segredo trancado. Esta tela é igual pros dois resultados: pode ligar o projetor.<br>Play no botão ou na tecla espaço.</div>
  </div>
  <div class="legenda">4. TELA DE PLAY</div>
</div></body></html>
