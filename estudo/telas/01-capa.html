<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Capa</title>
<link rel="stylesheet" href="base.css">
<style>
.lua{left:1120px;top:40px;width:330px;height:330px}
.et{left:1150px;top:150px;width:300px;height:190px}
.vader{right:40px;top:30px;width:260px;height:290px;fill:#0a0612;opacity:.9}
.jp{left:40px;top:34px;width:230px;height:230px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
.jp-texto{position:absolute;left:40px;top:262px;width:230px;text-align:center;font-family:var(--f-poster);font-size:22px;color:#fff;text-shadow:0 2px 0 #000;letter-spacing:.06em}
.trex{left:10px;top:540px;width:400px;height:280px;fill:#0a0612;z-index:2}
.palma{bottom:150px;width:340px;height:660px;z-index:2}
.palma.a{left:150px}.palma.b{right:120px;transform:scaleX(-1)}
.delorean{left:60px;bottom:30px;width:520px;height:200px;filter:drop-shadow(0 10px 10px rgba(0,0,0,.5))}
.rastro{position:absolute;left:0;bottom:84px;width:200px;height:14px;background:linear-gradient(90deg,transparent,#ff7a2e,#ffd23f);filter:blur(3px)}
.gameboy{right:120px;bottom:40px;width:170px;height:272px;transform:rotate(14deg);filter:drop-shadow(0 10px 10px rgba(0,0,0,.5))}
.cassete{right:330px;bottom:56px;width:190px;height:118px;transform:rotate(-8deg);filter:drop-shadow(0 10px 10px rgba(0,0,0,.5))}
.titulos{position:absolute;left:0;right:0;top:300px;text-align:center;z-index:3}
.t1{font-family:var(--f-poster);font-size:112px;line-height:1;color:#fff;text-shadow:0 0 2px #000,8px 8px 0 var(--magenta),8px 8px 0 var(--magenta);letter-spacing:.02em}
.t2{margin-top:18px;line-height:1;white-space:nowrap}
.t2 .nanda{font-family:var(--f-drip);font-size:200px;color:var(--rosa);-webkit-text-stroke:5px #2a0d2e;paint-order:stroke fill;text-shadow:10px 10px 0 #7a1a5a}
.t2 .e{font-family:var(--f-maquina);font-size:70px;color:#fff;margin:0 10px;text-shadow:3px 3px 0 #000}
.t2 .kaio{font-family:var(--f-poster);font-size:180px;color:var(--amarelo);-webkit-text-stroke:5px #3a2400;paint-order:stroke fill;text-shadow:10px 10px 0 #b35a00}
.bilhete{position:absolute;left:50%;top:655px;width:560px;margin-left:-280px;transform:rotate(-2.5deg);font-size:30px;z-index:4}
.matrix{position:absolute;right:110px;top:330px;font-family:var(--f-vhs);font-size:76px;color:var(--matrix);text-shadow:0 0 14px var(--matrix);letter-spacing:.1em;z-index:3}
.ep{position:absolute;right:110px;top:410px;font-family:var(--f-poster);font-size:34px;color:var(--amarelo);text-shadow:0 0 12px rgba(255,210,63,.7);letter-spacing:.06em;z-index:3}
.acao{position:absolute;left:50%;transform:translateX(-50%);bottom:34px;z-index:5}
.botao.neon{font-size:46px}
</style></head>
<body><script src="props.js"></script>
<div class="tela crt">
  <div class="pontos"><i></i><i></i><i></i></div>
  <div class="vidro">
    <div class="synth">
      <div class="estrelas"></div>
      <svg class="prop lua"><use href="#moon"/></svg>
      <svg class="prop et"><use href="#etbike"/></svg>
      <svg class="prop vader"><use href="#vader"/></svg>
      <svg class="prop jp"><use href="#jpbadge"/></svg>
      <div class="jp-texto">PARQUE DOS BEBÊS</div>
      <div class="sol"></div>
      <div class="montanhas"></div>
      <div class="cidade"></div>
      <div class="mar"></div>
      <div class="areia"></div>
      <div class="grade"></div>
      <svg class="prop palma a"><use href="#palm"/></svg>
      <svg class="prop palma b"><use href="#palm"/></svg>
      <svg class="prop trex"><use href="#trex"/></svg>
      <div class="rastro"></div>
      <svg class="prop delorean"><use href="#delorean"/></svg>
      <svg class="prop gameboy"><use href="#gameboy"/></svg>
      <svg class="prop cassete"><use href="#cassette"/></svg>
    </div>
    <div class="titulos">
      <div class="t1">CHÁ REVELAÇÃO</div>
      <div class="t2"><span class="nanda">Nanda</span><span class="e">e</span><span class="kaio">KAIO</span></div>
    </div>
    <div class="matrix">MATRIX</div>
    <div class="ep">EPISÓDIO I</div>
    <div class="bilhete">Seremos pais<br>na adolescência<br>(depois dos 30) ☺</div>
    <div class="acao"><a class="botao neon" href="#">▶ COMEÇAR</a></div>
  </div>
  <div class="legenda">1. TELA DE ABERTURA</div>
</div></body></html>
