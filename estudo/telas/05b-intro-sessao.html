<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Intro 2 · Sessão da Tarde</title>
<link rel="stylesheet" href="base.css">
<style>
.tela{background:linear-gradient(180deg,#2a0f4a 0%,#8a2a7a 35%,#f0632b 70%,#ffc233 100%);color:#fff;overflow:hidden}
.sol{position:absolute;left:50%;top:300px;width:620px;height:620px;margin-left:-310px;border-radius:50%;background:linear-gradient(180deg,#fff3a0,#ff9a3c 60%,#ff5a3c);box-shadow:0 0 120px 40px rgba(255,170,60,.5)}
.sol::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 44px,rgba(42,15,74,.9) 44px 60px);border-radius:50%;clip-path:inset(50% 0 0 0)}
.grade{position:absolute;left:-300px;right:-300px;bottom:0;height:420px;background:
  linear-gradient(90deg,rgba(255,255,255,.35) 2px,transparent 2px) 0 0/120px 100%,
  linear-gradient(0deg,rgba(255,255,255,.35) 2px,transparent 2px) 0 0/100% 60px;transform:perspective(500px) rotateX(60deg);transform-origin:50% 100%}
.mar{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(180deg,rgba(31,154,166,.0),rgba(31,154,166,.75))}
.t{position:absolute;left:0;right:0;top:120px;text-align:center}
.t .a{font-family:"Bungee Shade","Bungee",Impact;font-size:150px;line-height:1;letter-spacing:.02em;color:#fff;text-shadow:0 0 30px rgba(255,255,255,.4)}
.t .b{font-family:var(--f-nome);font-size:70px;margin-top:18px;color:#ffe8a3;letter-spacing:.08em;text-shadow:5px 5px 0 #2a0f4a}
.t .c{font:700 34px/1.3 var(--f-corpo);margin-top:14px;color:#fff;text-shadow:2px 2px 0 #2a0f4a}
.coq{position:absolute;bottom:160px;width:30px;height:420px;background:#2a0f4a;border-radius:20px}
.coq::before{content:"";position:absolute;top:-40px;left:-120px;width:280px;height:120px;background:radial-gradient(ellipse at 50% 100%,#2a0f4a 0 50%,transparent 52%)}
.coq.a{left:180px;transform:rotate(-8deg)}.coq.b{right:220px;transform:rotate(10deg)}
.hoje{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#2a0f4a;color:#ffe8a3;border:5px solid #fff;border-radius:999px;padding:14px 40px;font:800 30px var(--f-corpo);letter-spacing:.1em;text-transform:uppercase}
</style></head>
<body><div class="tela scanlines">
  <div class="sol"></div>
  <div class="grade"></div>
  <div class="mar"></div>
  <div class="coq a"></div><div class="coq b"></div>
  <div class="t">
    <div class="a">SESSÃO<br>DA TARDE</div>
    <div class="b">apresenta</div>
    <div class="c">um filme de família, com sabor de biscoito de polvilho e cheiro de protetor solar</div>
  </div>
  <div class="hoje">Hoje: Chá Revelação · Nanda &amp; Caio</div>
</div></body></html>
