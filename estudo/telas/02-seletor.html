<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Seletor</title>
<link rel="stylesheet" href="base.css">
<style>
.topo{position:absolute;left:0;right:0;top:70px;text-align:center}
.sub{margin-top:30px;font-size:34px;letter-spacing:.06em;text-transform:uppercase}
.cartas{position:absolute;left:50%;top:260px;transform:translateX(-50%);display:flex;gap:90px}
.polaroid.a{transform:rotate(-2deg)}.polaroid.b{transform:rotate(2deg)}
.acao{position:absolute;left:50%;transform:translateX(-50%);bottom:70px}
.cassete{left:60px;bottom:70px;width:300px;height:188px;transform:rotate(-14deg);filter:drop-shadow(0 10px 10px rgba(0,0,0,.4))}
.aviso{position:absolute;right:60px;bottom:44px;font-size:20px;text-transform:uppercase;letter-spacing:.04em;color:#3a3a3a;text-align:right;width:640px;line-height:1.4}
</style></head>
<body><script src="props.js"></script>
<div class="tela crt">
  <div class="pontos"><i></i><i></i><i></i></div>
  <div class="vidro">
    <div class="chuvisco"></div>
    <svg class="rabisco" style="left:110px;top:430px;color:#ff3d9a;width:120px;height:120px;transform:rotate(-15deg)"><use href="#heart"/></svg>
    <svg class="rabisco" style="right:150px;top:150px;color:#e2c22a;width:110px;height:110px"><use href="#smiley"/></svg>
    <svg class="rabisco" style="right:120px;top:520px;color:#3d8bff;width:100px;height:100px;transform:rotate(20deg)"><use href="#star5"/></svg>
    <svg class="rabisco" style="right:260px;bottom:110px;color:#ff3d9a;width:90px;height:90px;transform:rotate(-20deg)"><use href="#star5"/></svg>
    <svg class="rabisco" style="left:230px;top:140px;color:#3d8bff;width:80px;height:80px;transform:rotate(12deg)"><use href="#sparkle"/></svg>
    <svg class="prop cassete"><use href="#cassette"/></svg>
    <div class="topo">
      <span class="etiqueta grande">Qual é o resultado?</span>
      <div class="sub">Escolha o gênero do bebê:</div>
    </div>
    <div class="cartas">
      <div class="polaroid m a sel"><div class="foto"><img src="kaio.svg" alt=""></div><span class="etiqueta nome">Menino</span><span class="radio on"></span></div>
      <div class="polaroid f b"><div class="foto"><img src="nanda.svg" alt=""></div><span class="etiqueta nome">Menina</span><span class="radio"></span></div>
    </div>
    <div class="acao"><a class="botao" href="#">Confirmar</a></div>
    <div class="aviso">🔒 Só quem guarda o segredo vê esta tela.<br>O botão fica cinza até escolher.</div>
  </div>
  <div class="legenda">2. SELETOR DE GÊNERO</div>
</div></body></html>
