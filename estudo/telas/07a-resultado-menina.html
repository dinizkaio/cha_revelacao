<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Resultado · menina</title>
<link rel="stylesheet" href="base.css">
<style>
.synth{background:linear-gradient(180deg,#2a0a3a 0%,#7a1a6a 30%,#ff3d9a 60%,#ff7ac8 78%,#ffd23f 92%)}
.synth .sol{background:linear-gradient(180deg,#fff2a8,#ff7ac8 55%,#ff3d9a)}
.synth .grade{background:linear-gradient(90deg,rgba(255,255,255,.5) 2px,transparent 2px) 0 0/90px 100%,linear-gradient(0deg,rgba(255,255,255,.5) 2px,transparent 2px) 0 0/100% 36px}
.synth .areia{background:linear-gradient(180deg,#ff9ad0,#c22a69)}
.fogos{position:absolute;inset:0;z-index:2}
.fogo{position:absolute;width:300px;height:300px;background:repeating-conic-gradient(from 0deg,currentColor 0 3deg,transparent 3deg 15deg);border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 30%,#000 32%,#000 48%,transparent 50%);mask:radial-gradient(circle,transparent 30%,#000 32%,#000 48%,transparent 50%)}
.pers{position:absolute;left:50%;bottom:30px;height:640px;margin-left:-240px;z-index:4;filter:drop-shadow(0 16px 20px rgba(0,0,0,.5))}
.titulo{position:absolute;left:0;right:0;top:90px;text-align:center;z-index:5}
.pre{font-family:var(--f-maquina);font-size:40px;color:#fff;text-transform:uppercase;letter-spacing:.14em;text-shadow:2px 2px 0 #7a1a5a}
.grande{font-family:var(--f-poster);font-size:230px;line-height:1;color:#fff;margin-top:6px;-webkit-text-stroke:6px #7a1a5a;paint-order:stroke fill;text-shadow:0 0 30px var(--magenta),14px 14px 0 #7a1a5a;white-space:nowrap}
.bilhete{position:absolute;right:100px;bottom:120px;width:460px;transform:rotate(3deg);font-size:28px;z-index:5}
.fim{position:absolute;left:100px;bottom:70px;font-family:var(--f-vhs);font-size:64px;color:#fff;letter-spacing:.14em;text-shadow:3px 0 #0ff,-3px 0 #f0f;z-index:5}
.sparkle{color:#fff;z-index:3}
.flor{z-index:3;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
</style></head>
<body><script src="props.js"></script>
<div class="tela crt">
  <div class="pontos"><i></i><i></i><i></i></div>
  <div class="vidro">
    <div class="synth"><div class="estrelas"></div><div class="sol"></div><div class="montanhas"></div><div class="mar"></div><div class="areia"></div><div class="grade"></div></div>
    <div class="fogos">
      <div class="fogo" style="left:120px;top:80px;color:#ffd23f"></div>
      <div class="fogo" style="right:160px;top:40px;color:#fff;width:380px;height:380px"></div>
      <div class="fogo" style="left:380px;top:360px;color:#36e2ff;width:220px;height:220px"></div>
      <div class="fogo" style="right:420px;top:300px;color:#ff7ac8;width:240px;height:240px"></div>
    </div>
    <svg class="rabisco sparkle" style="left:300px;top:560px;width:80px;height:80px"><use href="#sparkle"/></svg>
    <svg class="rabisco sparkle" style="right:300px;top:620px;width:60px;height:60px"><use href="#sparkle"/></svg>
    <svg class="rabisco sparkle" style="left:620px;top:720px;width:50px;height:50px"><use href="#sparkle"/></svg>
    <svg class="prop flor" style="left:140px;bottom:300px;width:120px;height:120px"><use href="#flower"/></svg>
    <svg class="prop flor" style="right:180px;bottom:420px;width:90px;height:90px;transform:rotate(20deg)"><use href="#flower"/></svg>
    <div class="titulo"><div class="pre">Três em linha. Tá revelado:</div><div class="grande">É MENINA!</div></div>
    <img class="pers" src="nanda.svg" alt="">
    <div class="bilhete">Nanda &amp; Kaio<br>pais na adolescência<br>(depois dos 30)<br>outubro de 2026</div>
    <div class="fim">◼ STOP · FIM</div>
  </div>
  <div class="legenda">7. RESULTADO · MENINA</div>
</div></body></html>
