<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Intro 6 · Uma nova aventura</title>
<link rel="stylesheet" href="base.css">
<style>
.synth{background:linear-gradient(180deg,#2a0f4a 0%,#7a2a7a 30%,#ff5a6e 55%,#ff9a3c 72%,#ffd23f 85%)}

.palma{top:60px;width:360px;height:680px}

.t2 .e{font-family:var(--f-maquina);font-size:56px;color:#fff;margin:0 10px;text-shadow:3px 3px 0 #000}

.bilhete{position:absolute;left:50%;top:470px;width:620px;margin-left:-310px;transform:rotate(-1.5deg);font-size:30px;z-index:4}
