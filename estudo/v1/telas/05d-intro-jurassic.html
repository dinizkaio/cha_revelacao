<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Intro 4 · Jurassic</title>
<link rel="stylesheet" href="base.css">
<style>
.tela{background:radial-gradient(ellipse at 50% 40%,#1a1208,#000 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{position:relative;width:560px;height:560px;border-radius:50%;background:#c8102e;border:22px solid var(--ipe);box-shadow:0 0 0 10px #000,0 0 0 16px var(--ipe),0 30px 80px rgba(0,0,0,.8);display:grid;place-items:center}
.logo svg{width:360px;height:360px}
.t1{font-family:var(--f-titulo);font-size:168px;line-height:.9;letter-spacing:.02em;color:#fff2c4;margin-top:40px;
  text-shadow:0 0 2px #000,8px 8px 0 #c8102e,8px 8px 0 #c8102e}
.t2{font-family:var(--f-titulo);font-size:72px;letter-spacing:.14em;color:var(--ipe);margin-top:16px}
.rodape{position:absolute;bottom:50px;font:700 26px var(--f-corpo);letter-spacing:.3em;color:#9a8a60;text-transform:uppercase}
.folhas{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(ellipse 400px 900px at 0% 100%,rgba(30,60,20,.75),transparent 70%),
  radial-gradient(ellipse 400px 900px at 100% 100%,rgba(30,60,20,.75),transparent 70%)}
</style></head>
<body><div class="tela grao">
  <div class="folhas"></div>
  <div class="logo">
    <!-- silhueta: chupeta (no lugar do esqueleto) -->
    <svg viewBox="0 0 200 200"><g fill="#0a0a0a">
      <ellipse cx="100" cy="72" rx="34" ry="46"/>
      <rect x="40" y="104" width="120" height="30" rx="15"/>
      <path d="M58 134 a42 42 0 1 0 84 0z"/>
      <circle cx="100" cy="162" r="30" fill="none" stroke="#0a0a0a" stroke-width="14"/>
    </g></svg>
  </div>
  <div class="t1">CHÁ REVELAÇÃO</div>
  <div class="t2">NANDA &amp; CAIO</div>
  <div class="rodape">Ilha do Guarujá · Vale do Paraíba · 65 milhões de anos depois dos anos 90</div>
</div></body></html>
