<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Confirmar</title>
<link rel="stylesheet" href="base.css">
<style>
.tela{background:var(--tinta);color:var(--papel)}
.fundo{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.4px,transparent 1.6px);background-size:14px 14px;filter:blur(2px);opacity:.5}
.fundo .cartas{position:absolute;left:50%;top:300px;transform:translateX(-50%);display:flex;gap:60px}
.fundo .carta{width:560px;height:520px;border-radius:40px;background:var(--menino);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.fundo .carta.f{background:var(--menina)}
.fundo .carta img{height:380px;margin-bottom:60px}
.veu{position:absolute;inset:0;background:rgba(10,6,4,.72)}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1040px;padding:56px 64px 54px;text-align:center;color:var(--tinta)}
.modal h2{font-family:var(--f-nome);font-size:92px;margin:0;letter-spacing:.02em}
.modal p{font-size:30px;margin:18px 0 0;color:var(--tinta-2)}
.escolha{display:inline-flex;align-items:center;gap:18px;margin-top:26px;padding:12px 30px 12px 14px;border-radius:999px;background:var(--menina);color:#fff;border:6px solid var(--tinta);font-family:var(--f-nome);font-size:54px;letter-spacing:.04em}
.escolha img{height:84px;width:84px;object-fit:cover;object-position:top;border-radius:50%;background:#fff;border:4px solid var(--tinta)}
.acoes{display:flex;justify-content:center;gap:28px;margin-top:40px}
.acoes .botao{white-space:nowrap;font-size:36px}
</style></head>
<body><div class="tela">
  <div class="fundo"><div class="cartas"><div class="carta"><img src="menino.svg" alt=""></div><div class="carta f"><img src="menina.svg" alt=""></div></div></div>
  <div class="veu"></div>
  <div class="modal cartaz">
    <h2>Tem certeza?</h2>
    <div class="escolha"><img src="menina.svg" alt="">Menina</div>
    <p>Ao confirmar, essa escolha some da tela e fica trancada. Só o play, lá na frente, vai contar pra todo mundo.</p>
    <div class="acoes">
      <a class="botao fantasma" href="#">Voltar</a>
      <a class="botao escuro" href="#">🔒 Confirmar e trancar</a>
    </div>
  </div>
</div></body></html>
