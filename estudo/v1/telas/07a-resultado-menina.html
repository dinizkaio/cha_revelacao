<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Resultado · menina</title>
<link rel="stylesheet" href="base.css">
<style>
.tela{background:var(--menina);color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.raios{position:absolute;left:50%;top:50%;width:3000px;height:3000px;margin:-1500px 0 0 -1500px;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.14) 0 9deg,transparent 9deg 18deg)}
.pontos{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.18) 2px,transparent 2.4px);background-size:22px 22px}
.conteudo{position:relative;z-index:2;display:flex;align-items:center;gap:50px}
.texto{text-align:left}
.pre{font-family:var(--f-nome);font-size:64px;line-height:1.25;color:#ffe3ee;letter-spacing:.04em;text-shadow:5px 5px 0 var(--menina-2)}
.grande{font-family:var(--f-titulo);font-size:250px;line-height:1;white-space:nowrap;color:#fff;text-shadow:14px 14px 0 var(--tinta);margin:10px 0 0}
.pos{font:700 40px/1.3 var(--f-corpo);margin-top:34px;color:#fff;max-width:900px}
.pos b{background:var(--tinta);color:var(--ipe);padding:4px 16px;border-radius:12px;font-family:var(--f-nome);font-weight:400;font-size:44px}
.pers{height:700px;filter:drop-shadow(16px 16px 0 var(--tinta))}
.conf{position:absolute;width:26px;height:40px;border-radius:4px;background:var(--ipe);border:3px solid var(--tinta)}
.fim{position:absolute;right:60px;bottom:50px;background:var(--tinta);color:var(--papel);border:5px solid #fff;padding:10px 30px;font-family:var(--f-vhs);font-size:44px;letter-spacing:.12em}
.placar{position:absolute;left:60px;bottom:50px;background:#fff;color:var(--tinta);border:5px solid var(--tinta);padding:12px 26px;font-family:var(--f-arcade);font-size:22px;line-height:1.6;box-shadow:8px 8px 0 var(--tinta)}
</style></head>
<body><div class="tela">
  <div class="raios"></div><div class="pontos"></div>
  <div class="conf" style="left:200px;top:120px;transform:rotate(20deg)"></div>
  <div class="conf" style="left:420px;top:900px;transform:rotate(-30deg);background:#fff"></div>
  <div class="conf" style="left:1500px;top:90px;transform:rotate(60deg);background:#fff"></div>
  <div class="conf" style="left:1750px;top:600px;transform:rotate(-15deg)"></div>
  <div class="conf" style="left:1100px;top:60px;transform:rotate(45deg);background:var(--mar)"></div>
  <div class="conf" style="left:980px;top:980px;transform:rotate(10deg);background:var(--mar)"></div>
  <div class="ipe-flor" style="left:90px;top:520px;transform:rotate(15deg) scale(1.6)"></div>
  <div class="ipe-flor" style="left:1800px;top:300px;transform:rotate(-25deg) scale(1.3)"></div>
  <div class="ipe-flor" style="left:640px;top:140px;transform:rotate(40deg)"></div>
  <div class="conteudo">
    <img class="pers" src="menina.svg" alt="">
    <div class="texto">
      <div class="pre">Três em linha. Tá revelado, é…</div>
      <h1 class="grande">MENINA!</h1>
      <p class="pos">Nanda &amp; Caio, pais na adolescência, <b>GAME OVER</b> pra noite de sono.</p>
    </div>
  </div>
  <div class="placar">MENINA WINS<br>FLAWLESS VICTORY</div>
  <div class="fim">◼ STOP · FIM</div>
</div></body></html>
