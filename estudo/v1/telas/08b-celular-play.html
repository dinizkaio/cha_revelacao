<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Play · celular</title>
<link rel="stylesheet" href="base.css">
<style>
body{font-size:16px}
.tela{width:390px;height:844px;background:var(--papel);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.marca .titulo{font-size:26px;display:block}
.marca .nome{font-size:24px;color:var(--menino)}
.marca .nome em{font-style:normal;color:var(--menina)}
.fita{position:relative;width:250px;height:150px;background:#1d1d1d;border:5px solid var(--tinta);border-radius:10px;box-shadow:8px 8px 0 var(--tinta);margin-top:28px}
.fita .r{position:absolute;top:40px;width:40px;height:40px;border-radius:50%;background:#fff;border:6px solid #777;box-shadow:inset 0 0 0 4px #222}
.fita .r1{left:44px}.fita .r2{right:44px}
.fita .et{position:absolute;left:18px;right:18px;bottom:10px;height:30px;background:#fff;border:2px solid var(--tinta);font:16px/26px var(--f-vhs);color:var(--tinta)}
h1{font-family:var(--f-nome);font-size:46px;margin:26px 0 0}
p{font-size:17px;margin:8px 0 0;color:var(--tinta-2);line-height:1.4}
.play{margin-top:28px;width:150px;height:150px;border-radius:50%;background:var(--ipe);border:6px solid var(--tinta);box-shadow:8px 8px 0 var(--tinta);display:grid;place-items:center}
.play::after{content:"";border-left:62px solid var(--tinta);border-top:38px solid transparent;border-bottom:38px solid transparent;margin-left:14px}
.cadeado{display:inline-flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--tinta);border-radius:999px;padding:4px 12px;font:800 14px var(--f-corpo);margin-top:10px}
</style></head>
<body><div class="tela grao">
  <div class="marca"><span class="titulo">Chá Revelação</span><span class="nome"><em>Nanda</em> &amp; Caio</span></div>
  <span class="cadeado">🔒 Segredo trancado</span>
  <div class="fita"><span class="r r1"></span><span class="r r2"></span><span class="et">NANDA &amp; CAIO · 2026</span></div>
  <h1>Fita na máquina.</h1>
  <p>Esta tela não entrega nada. Ligue o projetor ou espelhe a tela, e aperte o play.</p>
  <div class="play"></div>
</div></body></html>
